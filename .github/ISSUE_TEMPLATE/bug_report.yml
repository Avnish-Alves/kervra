name: Bug report
description: Report a problem with Kervra
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove sensitive personal or health information from everything you share.
  - type: input
    id: environment
    attributes:
      label: Environment and platform
      description: Device, OS, and app version if available.
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter and Dart versions
      description: If relevant; leave blank if unknown.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove private information before attaching.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm sensitive personal and health data has been removed.
          required: true
