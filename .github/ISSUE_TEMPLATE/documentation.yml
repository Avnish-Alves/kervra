name: Documentation
description: Report a documentation problem or suggest an improvement
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Document or section
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Problem or gap
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
