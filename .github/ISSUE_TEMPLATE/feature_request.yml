name: Feature request
description: Suggest a product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or need would this address?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: User benefit
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Offline, local-first, and privacy considerations
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
